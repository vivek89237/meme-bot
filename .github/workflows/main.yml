name: Instagram Meme Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate code
        run: |
          npm run typecheck
          npm test

      - name: Run meme agent
        run: npm run agent
        env:
          # Instagram
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GRAPH_API_VERSION: v24.0

          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}

          # Hugging Face
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL || secrets.HF_MODEL }}
          HF_IMAGE_MODEL: ${{ vars.HF_IMAGE_MODEL || secrets.HF_IMAGE_MODEL || 'black-forest-labs/FLUX.1-dev' }}
          HF_IMAGE_PROVIDER: ${{ vars.HF_IMAGE_PROVIDER || secrets.HF_IMAGE_PROVIDER || 'fal-ai' }}
          HF_IMAGE_STEPS: ${{ vars.HF_IMAGE_STEPS || secrets.HF_IMAGE_STEPS || '28' }}
          HF_IMAGE_GUIDANCE: ${{ vars.HF_IMAGE_GUIDANCE || secrets.HF_IMAGE_GUIDANCE || '3.5' }}
          HF_IMAGE_SEED: ${{ vars.HF_IMAGE_SEED || secrets.HF_IMAGE_SEED }}
          HF_VISION_MODEL: ${{ vars.HF_VISION_MODEL || secrets.HF_VISION_MODEL }}
          HF_VISION_PROVIDER: ${{ vars.HF_VISION_PROVIDER || secrets.HF_VISION_PROVIDER }}
          MEME_TEMPLATE: ${{ vars.MEME_TEMPLATE || secrets.MEME_TEMPLATE || 'light' }}
